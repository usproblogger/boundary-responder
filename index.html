<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boundary & Enmeshment Responder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --warn: #f59e0b;
      --ok: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .subtitle { font-size: 0.85rem; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    textarea, input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    textarea { min-height: 100px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 540px) { .row { grid-template-columns: 1fr; } }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); color: #fff; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }
    button.secondary:hover { background: #334155; }
    .tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: var(--warn);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin: 0 6px 6px 0;
    }
    .reply-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .grounding {
      border-left: 3px solid var(--ok);
      padding-left: 12px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    details summary {
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    .log-item {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Boundary & Enmeshment Responder</h1>
    <div class="subtitle">Strip emotional hooks · Hold your frame · No JADE</div>
  </div>
  <button class="secondary" onclick="toggleSettings()">API Settings</button>
</header>

<!-- Optional AI Settings -->
<div id="settingsPanel" class="card" style="display:none;">
  <label>Mode / Provider (Offline works with zero API keys)</label>
  <select id="provider" onchange="saveSettings()">
    <option value="offline">Offline Rule & Template Engine (Free / Instant)</option>
    <option value="groq">Groq API (Bring Your Own Key)</option>
    <option value="openai">OpenAI API (Bring Your Own Key)</option>
    <option value="gemini">Gemini API (Bring Your Own Key)</option>
  </select>
  <div id="apiFields" style="display:none;">
    <label>API Key (Stored locally in your browser)</label>
    <input type="password" id="apiKey" placeholder="Paste API key..." onchange="saveSettings()" />
    <label>Model Name</label>
    <input type="text" id="modelName" placeholder="e.g. llama-3.1-8b-instant, gpt-4o-mini, gemini-2.5-flash" onchange="saveSettings()" />
  </div>
</div>

<!-- Pause & Grounding Reminder -->
<div class="card">
  <div class="grounding">
    <strong>Adult Ego-State Check:</strong> You are not responsible for regulating another adult's boredom, loneliness, or anxiety. Do not <strong>J</strong>ustify, <strong>A</strong>rgue, <strong>D</strong>efend, or <strong>E</strong>xplain.
  </div>
</div>

<!-- Main Input -->
<div class="card">
  <label for="incoming">1. Paste Incoming Message</label>
  <textarea id="incoming" placeholder="Paste the message from your parent here..."></textarea>

  <div class="row">
    <div>
      <label for="stance">2. Boundary Stance</label>
      <select id="stance">
        <option value="medium">Medium Chill (Warm, calm, detached)</option>
        <option value="gray">Gray Rock (Minimal, neutral, factual)</option>
        <option value="firm">Firm Limit (Clear boundary & timeline)</option>
      </select>
    </div>
    <div>
      <label for="lang">3. Reply Language</label>
      <select id="lang">
        <option value="ru">Русский (Russian)</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <button onclick="analyzeAndGenerate()" style="width:100%;">Analyze Hooks & Draft Reply</button>
</div>

<!-- Output -->
<div id="outputCard" class="card" style="display:none;">
  <label>Detected Enmeshment / Manipulation Hooks</label>
  <div id="hooksList" style="margin-bottom:12px;"></div>

  <label>Literal Core Fact (Without Emotional Subtext)</label>
  <div id="coreFact" style="font-size:0.9rem; color:#cbd5e1; margin-bottom:12px;"></div>

  <label>Suggested Boundary-Safe Reply</label>
  <div id="replyText" class="reply-box"></div>

  <div class="actions">
    <button onclick="copyReply()">Copy Reply</button>
    <button class="secondary" onclick="saveToLog()">Save to Private Log</button>
  </div>
</div>

<!-- Local Log -->
<div class="card">
  <details>
    <summary>Private Boundary Log (Stored Locally)</summary>
    <div id="logContainer" style="margin-top:10px;"></div>
    <button class="secondary" onclick="clearLog()" style="margin-top:12px; font-size:0.8rem;">Clear Log</button>
  </details>
</div>

<script>
  // Load saved settings
  window.onload = () => {
    document.getElementById("provider").value = localStorage.getItem("ber_provider") || "offline";
    document.getElementById("apiKey").value = localStorage.getItem("ber_apikey") || "";
    document.getElementById("modelName").value = localStorage.getItem("ber_model") || "llama-3.1-8b-instant";
    toggleApiFields();
    renderLog();
  };

  function toggleSettings() {
    const p = document.getElementById("settingsPanel");
    p.style.display = p.style.display === "none" ? "block" : "none";
  }

  function toggleApiFields() {
    const provider = document.getElementById("provider").value;
    document.getElementById("apiFields").style.display = provider === "offline" ? "none" : "block";
  }

  function saveSettings() {
    localStorage.setItem("ber_provider", document.getElementById("provider").value);
    localStorage.setItem("ber_apikey", document.getElementById("apiKey").value.trim());
    localStorage.setItem("ber_model", document.getElementById("modelName").value.trim());
    toggleApiFields();
  }

  function detectPatterns(text) {
    const t = text.toLowerCase();
    const hooks = [];

    if (/(волнуюсь|переживаю|не хочешь|игнорируешь|обид|worry|worried|ignore|don't care|hurt)/.test(t)) {
      hooks.push("Guilt Induction / Emotional Responsibility Transfer");
    }
    if (/(он думает|она говорит|люди скажут|новый муж|друзья|he thinks|she says|third person|new husband|friends)/.test(t)) {
      hooks.push("Triangulation / Third-Person Framing");
    }
    if (/(срочно|прямо сейчас|сколько можно|ждать|urgent|right now|waiting|immediately)/.test(t)) {
      hooks.push("Manufactured Urgency / Timeline Pressure");
    }
    if (/(деньги|дорого|тратить|не надо|money|expensive|spend|waste)/.test(t)) {
      hooks.push("Financial / Autonomy Intrusion");
    }
    if (hooks.length === 0) {
      hooks.push("General Check-In / Low-Grade Enmeshment");
    }
    return hooks;
  }

  function offlineGenerate(text, stance, lang, hooks) {
    const hasThirdPerson = hooks.some(h => h.includes("Triangulation"));
    const hasUrgency = hooks.some(h => h.includes("Urgency") || h.includes("Guilt"));
    const hasFinance = hooks.some(h => h.includes("Financial"));

    let fact = lang === "ru"
      ? "Собеседник хочет получить подтверждение связи или обсудить текущие дела, используя эмоциональный фон."
      : "The sender wants confirmation or contact, wrapped in emotional pressure.";

    let reply = "";

    if (lang === "ru") {
      if (stance === "gray") {
        reply = "Привет. Всё в порядке, я сейчас занят делами. Как освобожусь — напишу или позвоню.";
      } else if (stance === "firm") {
        reply = "Я сейчас занят и не могу обсуждать это на бегу. Как и договаривались, свяжусь, когда освобожусь.";
      } else {
        // Medium Chill
        if (hasThirdPerson) {
          reply = "Свой круг общения и друзья — это всегда здорово. Я сейчас доделываю дела и, как и обещал, позвоню, как только освобожусь.";
        } else if (hasFinance) {
          reply = "Спасибо за заботу, вопрос бюджета я полностью закрыл сам. Как освобожусь, спокойно всё обсудим.";
        } else if (hasUrgency) {
          reply = "Не волнуйся, всё в порядке! Я просто сейчас занят делами. Наберу тебе, как только освобожусь.";
        } else {
          reply = "Спасибо, что написала! Всё хорошо, я сейчас в делах. Свяжусь с тобой позже, как освобожусь.";
        }
      }
    } else {
      if (stance === "gray") {
        reply = "Hi. Everything is fine, I'm busy right now. I'll reach out once I'm free.";
      } else if (stance === "firm") {
        reply = "I'm tied up at the moment and can't talk right now. I will call when my schedule opens up, as planned.";
      } else {
        if (hasThirdPerson) {
          reply = "Having friends and your own social circle is always great. I'm wrapping up a few things right now and will call as soon as I'm free.";
        } else if (hasFinance) {
          reply = "I appreciate the thought, and I've got the budget completely covered on my end. Let's catch up once I'm free.";
        } else if (hasUrgency) {
          reply = "No need to worry, everything is fine! I'm just tied up with work right now and will call you as soon as I'm free.";
        } else {
          reply = "Thanks for checking in! Things are going well—I'm in the middle of a few tasks and will reach out later today.";
        }
      }
    }

    return { fact, reply };
  }

  async function analyzeAndGenerate() {
    const incoming = document.getElementById("incoming").value.trim();
    if (!incoming) return;

    const stance = document.getElementById("stance").value;
    const lang = document.getElementById("lang").value;
    const provider = document.getElementById("provider").value;
    const apiKey = document.getElementById("apiKey").value.trim();
    const model = document.getElementById("modelName").value.trim();

    const hooks = detectPatterns(incoming);
    document.getElementById("hooksList").innerHTML = hooks.map(h => `<span class="tag">${h}</span>`).join("");
    document.getElementById("outputCard").style.display = "block";
    document.getElementById("replyText").textContent = "Generating...";

    if (provider === "offline" || !apiKey) {
      const res = offlineGenerate(incoming, stance, lang, hooks);
      document.getElementById("coreFact").textContent = res.fact;
      document.getElementById("replyText").textContent = res.reply;
      return;
    }

    const systemPrompt = `You are a clinical communication coach specializing in family enmeshment, codependency, and Transactional Analysis (Adult ego state).
Analyze the incoming message from a parent.
1. Extract the literal logistical fact in 1 short sentence (stripping guilt, triangulation, or urgency).
2. Draft a concise reply in ${lang === "ru" ? "Russian" : "English"} using the "${stance}" boundary style:
   - "gray": minimal, neutral, zero emotional fuel.
   - "medium": warm, polite, validates autonomy, refuses guilt/responsibility transfer.
   - "firm": clear boundary and timeline, zero JADE (Justify, Argue, Defend, Explain).
Return valid JSON: {"fact": "...", "reply": "..."}`;

    try {
      let jsonResponse;
      if (provider === "gemini") {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model || "gemini-2.5-flash"}:generateContent?key=${apiKey}`;
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\n\nIncoming message:\n${incoming}` }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        const data = await r.json();
        const raw = data.candidates[0].content.parts[0].text;
        jsonResponse = JSON.parse(raw);
      } else {
        const endpoint = provider === "groq"
          ? "https://api.groq.com/openai/v1/chat/completions"
          : "https://api.openai.com/v1/chat/completions";
        const r = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model || (provider === "groq" ? "llama-3.1-8b-instant" : "gpt-4o-mini"),
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: incoming }
            ],
            response_format: { type: "json_object" }
          })
        });
        const data = await r.json();
        jsonResponse = JSON.parse(data.choices[0].message.content);
      }

      document.getElementById("coreFact").textContent = jsonResponse.fact;
      document.getElementById("replyText").textContent = jsonResponse.reply;
    } catch (err) {
      const fallback = offlineGenerate(incoming, stance, lang, hooks);
      document.getElementById("coreFact").textContent = `${fallback.fact} (API fallback triggered)`;
      document.getElementById("replyText").textContent = fallback.reply;
    }
  }

  function copyReply() {
    const text = document.getElementById("replyText").textContent;
    navigator.clipboard.writeText(text);
  }

  function saveToLog() {
    const logs = JSON.parse(localStorage.getItem("ber_logs") || "[]");
    logs.unshift({
      date: new Date().toLocaleString(),
      incoming: document.getElementById("incoming").value.trim(),
      reply: document.getElementById("replyText").textContent
    });
    localStorage.setItem("ber_logs", JSON.stringify(logs.slice(0, 25)));
    renderLog();
  }

  function renderLog() {
    const logs = JSON.parse(localStorage.getItem("ber_logs") || "[]");
    const container = document.getElementById("logContainer");
    if (logs.length === 0) {
      container.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">No saved entries yet.</div>`;
      return;
    }
    container.innerHTML = logs.map(item => `
      <div class="log-item">
        <div style="color:var(--muted); font-size:0.75rem;">${item.date}</div>
        <div><strong>In:</strong> ${item.incoming}</div>
        <div style="color:var(--ok); margin-top:4px;"><strong>Out:</strong> ${item.reply}</div>
      </div>
    `).join("");
  }

  function clearLog() {
    localStorage.removeItem("ber_logs");
    renderLog();
  }
</script>
</body>
</html>
